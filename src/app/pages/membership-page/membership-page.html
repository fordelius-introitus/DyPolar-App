<app-header></app-header>

<div class="page-body">
    <div class="premium-benefits-wrapper">
        <div class="premium-table-container">
            <table class="premium-table">
                <thead>
                    <tr>
                        <th>Benefícios</th>
                        <th>Plano Gratuito</th>
                        <th class="highlight">Plano Premium</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Acesso Ilimitado ao Acervo Digital</td>
                        <td>❌</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <td>Filtros e Recomendações Avançadas</td>
                        <td>✔️</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <td>Descontos na Vitrine de Livros Físicos</td>
                        <td>❌</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <td>Suporte Prioritário</td>
                        <td>❌</td>
                        <td>✔️</td>
                    </tr>
                </tbody>
            </table>
            <button class="assine-premium-btn" [disabled]="localUser?.isMember">
                {{ localUser?.isMember ? 'Assinatura Ativa' : 'Quero ser Premium' }}
            </button>
        </div>
        <div class="book-benefits-container">
            <div class="benefits-head">
                <h2>Vitrine de Livros Físicos</h2>
                <span>Descontos de até 50% para assinantes Premium</span>
            </div>
            
            <div class="benefits-body">
                <figure class="mini-book-card" *ngFor="let book of bookList | slice:0:6">
                    <img [src]="book.img" [alt]="book.titulo">
                </figure>
            </div>
        </div>
        
    </div>
</div>

<app-footer></app-footer>
